name: aero_iptv
description: Client IPTV M3U et Xtream Codes pour Android TV, Fire OS et Windows.
publish_to: none
version: 0.3.0+24
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  country_flags: ^4.1.2
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.0
  http: ^1.2.0
  intl: any
  iptv_data:
    path: ../packages/iptv_data
  iptv_domain:
    path: ../packages/iptv_domain
  iptv_player:
    path: ../packages/iptv_player
  path: ^1.9.0
  path_provider: ^2.1.0
  qr: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  image: ^4.8.0
  integration_test:
    sdk: flutter
  media_kit: ^1.2.6

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/aero/backgrounds/
    - assets/aero/chrome/
    - assets/aero/focus/
    - assets/aero/icons/
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/NotoSansArabic-OFL.txt
  # Inter (rsms/inter 4.1) et Noto Sans Arabic, sous licence SIL OFL 1.1.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
