name: Suggest an idea
description: A feature or improvement you'd like to see.
title: "Idea: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This form is public: never post your username, password or playlist address.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: Describe what you'd like to be able to do.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: How would it help you?
    validations:
      required: false
