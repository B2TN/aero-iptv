name: Report a bug
description: Something doesn't work as expected.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This form is public: never post your username, password or playlist address. Check your screenshots too before attaching them.
  - type: input
    id: version
    attributes:
      label: App version
      description: The number is on the releases page, next to the file you downloaded.
      placeholder: "0.1.9"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Your device
      options:
        - Windows PC
        - Fire TV Stick
        - Android TV
        - Other
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Your playlist type
      options:
        - Xtream Codes
        - M3U
        - Not related to the playlist
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Copy any error message. Hide any server address.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      placeholder: |
        1. Open a movie
        2. Choose a version
        3. The error appears
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Only once
    validations:
      required: false
